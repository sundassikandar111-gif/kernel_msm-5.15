name: "Build YASK GKI KPM (ThinLTO)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:

jobs:
  build-kernels:
    name: "Build YASK GKI KPM"
    runs-on: ubuntu-24.04

    env:
      KERNEL_LOC_DIR: "common_gki"
      KERNEL_NAME: "common"
      KERNEL_REPO: "https://android.googlesource.com/kernel/common"
      KERNEL_BRANCH: "android13-5.15-lts"
      DEFCONFIG_NAME: "gki_defconfig"
      LOCAL_VERSION: "-YASK-GKI-KPM"
      WORK_DIR: ${{ github.workspace }}
      KP_SUPERKEY: "MySecretKPMKey2026"

    steps:
      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2-dev libxml2-utils lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8

          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          sed -i \
           -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
           -e '/^TRIM_NONLISTED_KMI=/d' \
           -e '/^KMI_ENFORCED=/d' \
           -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
           -e '$a\TRIM_NONLISTED_KMI=0' \
           -e '$a\KMI_ENFORCED=0' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Configure kernel & apply hardware patch"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            if ! patch -p1 < "$file"; then
              echo "::error::CRITICAL PATCH FAILED: $file. The kernel would not boot."
              rm -f "$file"
              exit 1
            fi
            rm -f "$file"
          }

          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"

      - name: "Setup SukiSU-Ultra & SUSFS & KPM Configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf KernelSU drivers/kernelsu
          curl -LSs https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin

          # Integrate SUSFS so all linux/susfs*.h headers and fs patches are present
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 susfs_repo || true
          mkdir -p include/linux fs
          if [ -d "susfs_repo" ]; then
            # Copy ALL headers (susfs.h, susfs_def.h, etc.)
            cp -r susfs_repo/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
            cp -r susfs_repo/kernel_patches/fs/* fs/ 2>/dev/null || true
            patch -p1 < susfs_repo/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true
            rm -rf susfs_repo
          fi

          # Fallbacks if git clone failed
          if [ ! -f "include/linux/susfs.h" ]; then
            curl -sSL "https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h || true
          fi
          if [ ! -f "include/linux/susfs_def.h" ]; then
            curl -sSL "https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15/kernel_patches/include/linux/susfs_def.h" -o include/linux/susfs_def.h || true
          fi

          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          sed -i '/CONFIG_LTO_CLANG/d; /CONFIG_THINLTO/d; /CONFIG_LTO_NONE/d; /CONFIG_CFI_CLANG/d; /CONFIG_CFI_PERMISSIVE/d' "$CONFIG_FILE"

          echo 'CONFIG_LTO_CLANG=y' >> "$CONFIG_FILE"
          echo 'CONFIG_LTO_CLANG_THIN=y' >> "$CONFIG_FILE"
          echo '# CONFIG_LTO_CLANG_FULL is not set' >> "$CONFIG_FILE"
          echo '# CONFIG_LTO_NONE is not set' >> "$CONFIG_FILE"
          echo 'CONFIG_THINLTO=y' >> "$CONFIG_FILE"

          # CFI enabled (Standard mode, NOT permissive — vendor modules like smem.ko require __ubsan_handle_cfi_check_fail_abort)
          echo 'CONFIG_CFI_CLANG=y' >> "$CONFIG_FILE"
          echo '# CONFIG_CFI_PERMISSIVE is not set' >> "$CONFIG_FILE"

          # Ensure CFI fail handler is exported for vendor modules (smem.ko, qcom_hwspinlock.ko)
          if [ -f "kernel/cfi.c" ]; then
            if ! grep -q "EXPORT_SYMBOL(__ubsan_handle_cfi_check_fail_abort)" kernel/cfi.c; then
              echo 'EXPORT_SYMBOL(__ubsan_handle_cfi_check_fail_abort);' >> kernel/cfi.c
            fi
          fi

          echo 'CONFIG_KALLSYMS=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KALLSYMS_ALL=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KPM=y' >> "$CONFIG_FILE"

          # SUSFS Configs
          echo 'CONFIG_KSU_SUSFS=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_PATH=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' >> "$CONFIG_FILE"
          echo '# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_ENABLE_LOG=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_MAP=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_SU=y' >> "$CONFIG_FILE"

          echo 'CONFIG_TMPFS_XATTR=y' >> "$CONFIG_FILE"
          echo 'CONFIG_TMPFS_POSIX_ACL=y' >> "$CONFIG_FILE"
          echo 'CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y' >> "$CONFIG_FILE"
          echo '# CONFIG_TCP_CONG_BIC is not set' >> "$CONFIG_FILE"
          echo '# CONFIG_TCP_CONG_HTCP is not set' >> "$CONFIG_FILE"

      - name: "Verify Config"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "=== Critical config entries ==="
          grep -E "LTO|CFI|KPM|KALLSYMS|SUSFS" "$CONFIG_FILE" | sort -u
          echo "==============================="
          if ! grep -q "CONFIG_KPM=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_KPM=y missing!"
            exit 1
          fi
          if ! grep -q "CONFIG_LTO_CLANG_THIN=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_LTO_CLANG_THIN=y missing!"
            exit 1
          fi
          if ! grep -q "CONFIG_CFI_CLANG=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_CFI_CLANG=y missing!"
            exit 1
          fi
          if grep -q "CONFIG_LTO_NONE=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_LTO_NONE=y found — this WILL bootloop!"
            exit 1
          fi
          echo "✅ All config checks passed."

      - name: "Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=thin \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "Patch kernel with KPM host"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          wget -q https://github.com/bmax121/KernelPatch/releases/latest/download/kptools-linux -O kptools
          wget -q https://github.com/bmax121/KernelPatch/releases/latest/download/kpimg-android -O kpimg
          chmod +x kptools

          IMAGE_FILE="out/dist/Image"
          if [ ! -f "$IMAGE_FILE" ]; then
            echo "::error::Image not found at $IMAGE_FILE"
            ls -la out/dist/ || true
            exit 1
          fi

          echo "=== Running kptools patch ==="
          # In kptools CLI: -k specifies the kpimg binary!
          ./kptools -p \
            -i "$IMAGE_FILE" \
            -o out/dist/Image_patched \
            -k kpimg \
            -s "${{ env.KP_SUPERKEY }}" \
            2>&1 | tee kptools_output.log

          if [ -f out/dist/Image_patched ]; then
            mv out/dist/Image_patched "$IMAGE_FILE"
            echo "✅ KPM host injected successfully."
          else
            echo "::error::kptools failed. Output:"
            cat kptools_output.log
            exit 1
          fi

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Kernel
          path: ${{ env.WORK_DIR }}/out/dist/Image
          retention-days: 1

      - name: "Upload kptools log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kptools-log
          path: ${{ env.WORK_DIR }}/kptools_output.log
          retention-days: 3

  package-kernels:
    name: "Package Kernels"
    runs-on: ubuntu-24.04
    needs: [build-kernels]
    steps:
      - name: "Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "Create release package"
        run: |
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3
          cp ./artifacts/GKI-Kernel/Image AnyKernel3/

          ZIP_NAME="Anykernel3_YASK-KPM-ThinLTO.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..

      - name: "Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: YASK-KPM-Final
          path: Anykernel3_YASK-KPM-ThinLTO.zip
          retention-days: 7
