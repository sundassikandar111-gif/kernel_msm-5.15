name: "Build Kernel (KPM Enabled)"

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel Source"
        required: true
        default: "https://github.com/topnotchfreaks/kernel_msm-5.15"
      kernel_branch:
        description: "Branch"
        required: true
        default: "codelinaro"
      device:
        description: "Device (Defconfig)"
        required: true
        default: "gki"
      ksu_variant:
        description: "Root Manager"
        required: true
        type: choice
        default: "SukiSU"
        options:
          - "SukiSU"
          - "ReSukiSU"
          - "None"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Set up Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Get Clang
        run: |
          mkdir -p ${{ github.workspace }}/clang
          cd ${{ github.workspace }}/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r487747c.tar.gz
          tar -xzf clang-r487747c.tar.gz
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: Clone Kernel
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} ${{ github.event.inputs.kernel_source }} kernel

      - name: Apply KPM & LTO Fixes
        run: |
          cd kernel
          # 1. Force LTO off
          sed -i '/CONFIG_LTO_CLANG/d' arch/arm64/configs/${{ github.event.inputs.device }}_defconfig || true
          sed -i '/CONFIG_LTO_CLANG/d' arch/arm64/configs/gki_defconfig || true
          echo "# CONFIG_LTO_CLANG is not set" >> arch/arm64/configs/gki_defconfig
          
          # 2. Add KPM
          echo "CONFIG_KPM=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/gki_defconfig
          
          # 3. Install SukiSU with KPM
          if [ "${{ github.event.inputs.ksu_variant }}" = "SukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main --kpm
          fi

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          make O=out gki_defconfig
          make O=out -j$(nproc) LTO=none

      - name: Inject KPM Host
        run: |
          cd kernel
          # Download KernelPatch patcher
          wget -q https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux
          chmod +x patch_linux
          ./patch_linux out/arch/arm64/boot/Image
          if [ -f "oImage" ]; then
            mv oImage out/arch/arm64/boot/Image
            echo "KPM Host Injected"
          fi

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b master AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          zip -r9 ../Kernel.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-KPM
          path: Kernel.zip
