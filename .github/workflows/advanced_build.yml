name: "Build YASK GKI KPM (In-Tree)"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:

jobs:
  build-kernels:
    name: "Build YASK GKI kernel"
    runs-on: ubuntu-24.04

    env:
      KERNEL_LOC_DIR: "common_gki"
      KERNEL_NAME: "common"
      KERNEL_REPO: "https://android.googlesource.com/kernel/common"
      KERNEL_BRANCH: "android13-5.15-lts"
      DEFCONFIG_NAME: "gki_defconfig"
      LOCAL_VERSION: "-YASK-GKI-KPM"
      OUTPUT_NAME: "Image.gki.ksu"
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2-dev libxml2-utils lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8

          rm -rf .repo
          rm -rf common

          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          sed -i \
           -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
           -e '/^TRIM_NONLISTED_KMI=/d' \
           -e '/^KMI_ENFORCED=/d' \
           -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
           -e '$a\TRIM_NONLISTED_KMI=0' \
           -e '$a\KMI_ENFORCED=0' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            if ! patch -p1 < "$file"; then
              echo "::error::CRITICAL PATCH FAILED: $file. The kernel would not boot."
              rm -f "$file"
              exit 1
            fi
            rm -f "$file"
          }

          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"

      - name: "Add BBG Support"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/landlock/landlock,baseband_guard/ } }' security/Kconfig

      - name: "Setup SukiSU-Ultra (Builtin Branch with KPM)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf KernelSU drivers/kernelsu

          # Use the 'builtin' branch for in-tree KPM hooks
          curl -LSs https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin

          PATCHES=$(curl -s https://api.github.com/repos/topnotchfreaks/kernel_patches/releases/latest | \
                    grep -o 'browser_download_url.*\.patch' | cut -d\" -f3)
          SELECTED=$(echo "$PATCHES" | \
                     grep "0001-Implement-SUSFS" | \
                     grep "Android-${{ env.ANDROID_VERSION }}" | \
                     grep "Kernel-${{ env.KERNEL_VERSION }}" | head -n 1)
          [ -z "$SELECTED" ] && SELECTED=$(echo "$PATCHES" | grep "0001-Implement-SUSFS" | head -n 1)
          [ -z "$SELECTED" ] && { echo "No SUSFS patch"; exit 1; }
          curl -L -o susfs.patch "$SELECTED"
          patch -p1 < susfs.patch || echo "::warning::SUSFS hunks failed"
          rm -f susfs.patch

          # ============================================================
          # FIX 1: No leading whitespace! Each echo is a separate command
          #         so Kconfig entries are valid.
          # FIX 2: ThinLTO instead of LTO=none
          # FIX 3: CFI enabled + permissive mode
          # ============================================================
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          # --- LTO: ThinLTO (THE FIX — was LTO=none causing bootloops) ---
          sed -i '/CONFIG_LTO_CLANG/d; /CONFIG_THINLTO/d; /CONFIG_HAS_LTO_CLANG/d; /CONFIG_LTO_NONE/d; /CONFIG_LTO=/d' "$CONFIG_FILE"
          echo 'CONFIG_LTO_CLANG=y' >> "$CONFIG_FILE"
          echo 'CONFIG_LTO_CLANG_THIN=y' >> "$CONFIG_FILE"
          echo '# CONFIG_LTO_CLANG_FULL is not set' >> "$CONFIG_FILE"
          echo '# CONFIG_LTO_NONE is not set' >> "$CONFIG_FILE"
          echo 'CONFIG_THINLTO=y' >> "$CONFIG_FILE"
          echo 'CONFIG_HAS_LTO_CLANG=y' >> "$CONFIG_FILE"

          # --- CFI: Keep enabled + permissive (THE FIX — prevents panic from hook mismatches) ---
          sed -i '/CONFIG_CFI_CLANG/d; /CONFIG_CFI_PERMISSIVE/d' "$CONFIG_FILE"
          echo 'CONFIG_CFI_CLANG=y' >> "$CONFIG_FILE"
          echo 'CONFIG_CFI_PERMISSIVE=y' >> "$CONFIG_FILE"

          # --- KPM & KSU ---
          echo 'CONFIG_KALLSYMS=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KALLSYMS_ALL=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KPM=y' >> "$CONFIG_FILE"

          # --- SUSFS ---
          echo 'CONFIG_KSU_SUSFS=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_PATH=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' >> "$CONFIG_FILE"
          echo '# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_ENABLE_LOG=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_MAP=y' >> "$CONFIG_FILE"
          echo 'CONFIG_KSU_SUSFS_SUS_SU=y' >> "$CONFIG_FILE"

          # --- Misc ---
          echo 'CONFIG_TMPFS_XATTR=y' >> "$CONFIG_FILE"
          echo 'CONFIG_TMPFS_POSIX_ACL=y' >> "$CONFIG_FILE"
          echo 'CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y' >> "$CONFIG_FILE"
          echo 'CONFIG_TCP_CONG_ADVANCED=y' >> "$CONFIG_FILE"
          echo '# CONFIG_TCP_CONG_BIC is not set' >> "$CONFIG_FILE"
          echo 'CONFIG_TCP_CONG_WESTWOOD=y' >> "$CONFIG_FILE"
          echo '# CONFIG_TCP_CONG_HTCP is not set' >> "$CONFIG_FILE"
          echo 'CONFIG_TCP_CONG_BBR=y' >> "$CONFIG_FILE"
          echo 'CONFIG_DEFAULT_WESTWOOD=y' >> "$CONFIG_FILE"

      # ============================================================
      # FIX 4: Verify config BEFORE building (catches silent overrides)
      # ============================================================
      - name: "Verify critical config entries"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "=== Critical config verification ==="
          echo "--- LTO ---"
          grep -n "LTO" "$CONFIG_FILE" || true
          echo "--- CFI ---"
          grep -n "CFI" "$CONFIG_FILE" || true
          echo "--- KPM ---"
          grep -n "KPM" "$CONFIG_FILE" || true
          echo "--- KALLSYMS ---"
          grep -n "KALLSYMS" "$CONFIG_FILE" || true

          # Hard fail if LTO=none sneaked in
          if grep -q "CONFIG_LTO_NONE=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_LTO_NONE=y found! This WILL bootloop. Aborting."
            exit 1
          fi
          # Hard fail if ThinLTO is missing
          if ! grep -q "CONFIG_LTO_CLANG_THIN=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_LTO_CLANG_THIN=y not found! Aborting."
            exit 1
          fi
          # Hard fail if CFI is disabled
          if grep -q "# CONFIG_CFI_CLANG is not set" "$CONFIG_FILE"; then
            echo "::error::CFI is disabled! This WILL bootloop with ThinLTO. Aborting."
            exit 1
          fi
          echo "=== All checks passed ==="

      # ============================================================
      # FIX 5: Build with LTO=thin (was LTO=none — THE bootloop cause)
      # ============================================================
      - name: "Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=thin \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      # ============================================================
      # FIX 6: Verify the built config is correct (post-build check)
      # ============================================================
      - name: "Verify built kernel config"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "=== Post-build config from out/dist ==="
          if [ -f out/dist/config ]; then
            grep -E "LTO|CFI|KPM|KALLSYMS_ALL" out/dist/config
          fi
          # Also check the .config used during build
          BUILT_CONFIG=$(find out/ -name ".config" -path "*/common*" | head -1)
          if [ -n "$BUILT_CONFIG" ]; then
            echo "=== .config used during build: $BUILT_CONFIG ==="
            grep -E "LTO|CFI|KPM|KALLSYMS_ALL" "$BUILT_CONFIG"
          fi
          echo "=== Verifying Image exists ==="
          ls -lh out/dist/Image

      # ============================================================
      # FIX 7: Inject KPM host via patch_linux / kptools
      #         (THIS STEP WAS COMPLETELY MISSING)
      # ============================================================
      - name: "Patch kernel with KPM host (kptools)"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "=== Downloading latest kptools ==="
          # Get the latest release of KernelPatch
          KP_LATEST=$(curl -s https://api.github.com/repos/bmax121/KernelPatch/releases/latest \
                      | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "Latest KernelPatch version: $KP_LATEST"

          # Download kptools binary and kpimg
          curl -L -o kptools "https://github.com/bmax121/KernelPatch/releases/download/${KP_LATEST}/kptools-linux"
          curl -L -o kpimg "https://github.com/bmax121/KernelPatch/releases/download/${KP_LATEST}/kpimg-android"
          chmod +x kptools

          echo "=== Patching Image with KPM host ==="
          ./kptools -p \
            --image out/dist/Image \
            --out out/dist/Image_patched \
            --kpimg kpimg \
            --skey "my_superkey" \
            2>&1 | tee kptools_output.log

          # Check for critical errors
          if grep -qi "can't find arm64 relocation" kptools_output.log; then
            echo "::error::kptools failed to find relocation table. See log above."
            echo "::error::Trying SukiSU-Ultra fork of patch_linux as fallback..."

            # Fallback: try the SukiSU-Ultra fork
            git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch.git
            cd SukiSU_KernelPatch_patch
            # Build or use their patching tool
            if [ -f patch_linux ]; then
              chmod +x patch_linux
              ./patch_linux ../out/dist/Image ../out/dist/Image_patched
            elif [ -f patch.sh ]; then
              bash patch.sh ../out/dist/Image ../out/dist/Image_patched
            fi
            cd ..
          fi

          if [ -f out/dist/Image_patched ]; then
            echo "=== KPM host injection successful ==="
            mv out/dist/Image_patched out/dist/Image
            ls -lh out/dist/Image
          else
            echo "::error::Patched Image not found. KPM injection failed."
            exit 1
          fi

      - name: "Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Kernel
          path: ${{ env.WORK_DIR }}/out/dist/Image
          retention-days: 1

      # Also upload the build log for debugging
      - name: "Upload build logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.WORK_DIR }}/kptools_output.log
          retention-days: 3

  package-kernels:
    name: "Package Kernels"
    runs-on: ubuntu-24.04
    needs: [build-kernels]
    steps:
      - name: "Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "Create release package"
        run: |
          set -e
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3
          cp ./artifacts/GKI-Kernel/Image AnyKernel3/

          ZIP_NAME="Anykernel3_YASK-GKI-KPM_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: YASK-GKI-KPM
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
